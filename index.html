<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom English Tools</title>
<style>
@font-face{
  font-family:"HandwritingWeCan";
  src:url("https://crawlinuk.web.fc2.com/schoolapps/font/HandwritingWeCan-Medium.otf") format("opentype");
  font-display:swap;
}
:root{
  --ink:#17191d;--muted:#657078;--line:#dce4e8;--surface:#fff;--page:#f5f8f6;
  --shadow:0 10px 30px rgba(31,47,40,.12);
  --lets-try-1:#E83F73;
  --lets-try-2:#35B95A;
  --categories:#1687DF;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"HandwritingWeCan","Century Gothic","Tw Cen MT","Comic Sans MS",sans-serif;background:var(--page);color:var(--ink)}
button{font:inherit;cursor:pointer}
#fc2_footer{display:none!important}
header{height:72px;display:flex;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:28px}
main{padding:34px}
.hero{text-align:center;margin:20px auto 36px}
.hero h2{margin:0;font-size:clamp(42px,6vw,76px)}
.hero p{color:var(--muted);font-size:20px;font-weight:700}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{min-height:220px;border:0;border-radius:26px;padding:26px;color:#fff;box-shadow:var(--shadow);text-align:left}
.card strong,.card span{display:block}
.card strong{font-size:34px;margin-top:12px}
.card span:last-child{font-size:18px;font-weight:800;margin-top:6px}
.icon{font-size:68px}
.lt1{background:linear-gradient(145deg,#F05A8B,var(--lets-try-1))}
.lt2{background:linear-gradient(145deg,#57CB75,var(--lets-try-2))}
.disabled{background:linear-gradient(145deg,#57CB75,var(--lets-try-2));opacity:.5}
.categories{background:linear-gradient(145deg,#4CA7ED,var(--categories))}
@media(max-width:800px){main{padding:18px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Classroom English Tools</h1></header>
<main>
  <section class="hero">
    <h2>Classroom English Tools</h2>
    <p>Choose a textbook or browse by topic.</p>
  </section>
  <section class="grid">
    <button class="card lt1" id="letsTry1">
      <span class="icon">📘</span><strong>Let’s Try! 1</strong><span>Units 1–9</span>
    </button>
    <button class="card lt2" id="letsTry2">
      <span class="icon">📙</span><strong>Let’s Try! 2</strong><span>Units 1–9</span>
    </button>
    <button class="card categories" disabled>
      <span class="icon">🧩</span><strong>Categories</strong><span>Coming later</span>
    </button>
  </section>
</main>
<script>
document.getElementById("letsTry1").addEventListener("click",()=>location.href="lets_try_1.html");
document.getElementById("letsTry2").addEventListener("click",()=>location.href="lets_try_2.html");
</script>
</body>
</html>
