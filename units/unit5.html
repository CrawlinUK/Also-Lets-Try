<!DOCTYPE html>
<html lang="en" data-unit="5">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let’s Try! Tools — What do you like?</title>

  <link rel="preconnect" href="https://crawlinuk.web.fc2.com" crossorigin>
  <link rel="preload"
        href="https://crawlinuk.web.fc2.com/schoolapps/font/HandwritingWeCan-Medium.otf"
        as="font"
        type="font/otf"
        crossorigin>
  <link rel="stylesheet" href="../css/lets-try.css?v=20260930-1445">
  <script src="../js/lets-try-ui.js?v=20260930-1445" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <button class="menu-button" id="menuButton" type="button" aria-label="Return to unit menu">☰</button>

      <div class="site-title">
        <span class="unit-word">Unit</span>
        <span class="unit-number" id="unitNumber">5</span>
        <span class="unit-name" id="unitName">What do you like?</span>
      </div>

      <div class="game-title" id="gameTitle" aria-live="polite"></div>
    </div>
  </header>

  <main class="app" id="appScreen">
    <section class="flashcard" id="flashcard" aria-live="polite">
      <div class="flashcard-stage">
        <div class="answer-area" id="answerArea">
          <div class="picture-frame" id="pictureFrame">
            <div class="card-picture" id="cardPicture" role="img"></div>
          </div>
          <div class="display-text" id="displayText"></div>
        </div>

        <div class="game-area" id="gameArea" hidden></div>
      </div>

      <div class="floating-timer timer-control" id="floatingTimer" aria-label="Automatic timer">
        <button id="timerDownButton" type="button" aria-label="Decrease timer">−</button>
        <span class="timer-value" id="timerValue">3 sec</span>
        <button id="timerUpButton" type="button" aria-label="Increase timer">+</button>
      </div>

      <button class="floating-auto" id="autoButton" type="button"
              aria-label="Start automatic flashcards" title="Start automatic flashcards">▶</button>
    </section>

    <button class="side-nav side-previous" id="previousButton" type="button" aria-label="Previous card">◀</button>
    <button class="side-nav side-next" id="nextButton" type="button" aria-label="Next card">▶</button>
    <aside class="missing-answer-hints" id="missingAnswerHints" aria-label="Teacher Missing Game answers" hidden></aside>

    <nav class="control-bar" aria-label="Flashcard controls">
      <div class="card-counter">
        <strong id="counter">1 / 1</strong>
        <span id="modeLabel">Flashcard mode</span>
      </div>

      <button class="control shuffle" id="shuffleButton" type="button">↝ Shuffle</button>

      <div class="game-menu-wrap">
        <button class="control quiet game-menu-button" id="gameButton" type="button"
                aria-haspopup="true" aria-expanded="false">Game</button>
        <div class="game-menu" id="gameMenu" hidden>
          <button type="button" data-game="missing">Missing game</button>
          <button type="button" data-game="keyword">Keyword game</button>
          <button type="button" data-game="leftRight">Left or Right</button>
          <button type="button" data-game="flashcards">Back to flashcards</button>
        </div>
      </div>

      <button class="control quiet" id="settingsButton" type="button">⚙ Settings</button>
    </nav>

    <div class="keyboard-help collapsed" id="keyboardHelp">
      <div class="keyboard-help-text">
        ← / → = previous / next<br>
        Space / Enter = next<br>
        A = start / stop auto<br>
        R = shuffle<br>
        G = games<br>
        ↑ / ↓ = timer up / down<br>
        Esc = close menus
      </div>
      <div class="keyboard-help-icon">!</div>
    </div>
  </main>

  <div class="scrim" id="scrim"></div>

  <aside class="settings-panel" id="settingsPanel" aria-label="Settings">
    <div class="settings-heading">
      <h2>Settings</h2>
      <button class="close-button" id="closeSettingsButton" type="button" aria-label="Close settings">×</button>
    </div>

    <section class="setting-section selection-section">
      <div class="setting-actions setting-actions-top">
        <button id="selectAllButton" type="button">Select all</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
      <p class="message" id="message"></p>
      <div class="category-word-groups" id="cardOptionGrid"></div>
    </section>

    <section class="setting-section">
      <h3>Text to display</h3>
      <div class="segmented">
        <label>
          <input type="radio" name="textDisplay" value="word" checked>
          <span id="wordLabel">Word</span>
        </label>
        <label>
          <input type="radio" name="textDisplay" value="sentence">
          <span id="sentenceLabel">Sentence</span>
        </label>
        <label>
          <input type="radio" name="textDisplay" value="alternate">
          <span id="alternateLabel">Alternate</span>
        </label>
      </div>
    </section>

    <section class="setting-section">
      <h3>Display mode</h3>
      <div class="segmented">
        <label>
          <input type="radio" name="displayMode" value="pictureText" checked>
          <span>Picture + text</span>
        </label>
        <label>
          <input type="radio" name="displayMode" value="picture">
          <span>Picture only</span>
        </label>
        <label>
          <input type="radio" name="displayMode" value="text">
          <span>Text only</span>
        </label>
      </div>
    </section>

    <section class="setting-section">
      <h3>Size</h3>
      <div class="balance-labels" aria-hidden="true">
        <span>Image</span>
        <span>Text</span>
      </div>
      <div class="balance-slider">
        <span>◀</span>
        <input id="sizeBalanceRange" type="range" min="0" max="100" value="50" step="5"
               aria-label="Image and text size balance">
        <span>▶</span>
      </div>
    </section>
    <section class="setting-section">
      <h3>Missing Game answer size</h3>
      <div class="missing-answer-size-row">
        <input id="missingAnswerSizeRange" type="range" min="8" max="24" value="10" step="1"
               aria-label="Missing Game answer size">
        <output class="missing-answer-size-value" id="missingAnswerSizeValue" for="missingAnswerSizeRange">10 px</output>
      </div>
    </section>
  </aside>

  <script src="../js/lets-try-data.js?v=20260930-1445"></script>
  <script>
    const PLACEHOLDER_IMAGE = "";

    const UNIT_BOOK_ID = "lt1";
    const UNIT_NUMBER = 5;
    const UNIT_CATEGORY_IDS = LETS_TRY_DATA.getUnitCategoryIds(UNIT_BOOK_ID, UNIT_NUMBER);
    const UNIT_DEFAULT_IDS = new Set(
      Object.values(LETS_TRY_DATA.getUnitDefaults(UNIT_BOOK_ID, UNIT_NUMBER)).flat()
    );

    const CARD_TEXT = {
      baseball: ["baseball", "I like baseball."],
      dodgeball: ["dodgeball", "I like dodgeball."],
      soccer: ["soccer", "I like soccer."],
      basketball: ["basketball", "I like basketball."],
      swimming: ["swimming", "I like swimming."],
      "table-tennis": ["table tennis", "I like table tennis."],
      volleyball: ["volleyball", "I like volleyball."],

      "ice-cream": ["ice cream", "I like ice cream."],
      pudding: ["pudding", "I like pudding."],
      milk: ["milk", "I like milk."],
      "orange-juice": ["orange juice", "I like orange juice."],
      hamburger: ["hamburger", "I like hamburgers."],
      pizza: ["pizza", "I like pizza."],
      spaghetti: ["spaghetti", "I like spaghetti."],
      sushi: ["sushi", "I like sushi."],
      steak: ["steak", "I like steak."],
      salad: ["salad", "I like salad."],
      cake: ["cake", "I like cake."],
      egg: ["egg", "I like eggs."],
      jam: ["jam", "I like jam."],
      noodle: ["noodles", "I like noodles."],
      "rice-ball": ["rice ball", "I like rice balls."],
      sausage: ["sausage", "I like sausages."],

      apple: ["apple", "I like apples."],
      strawberry: ["strawberry", "I like strawberries."],
      grapes: ["grapes", "I like grapes."],
      orange: ["orange", "I like oranges."],
      pineapple: ["pineapple", "I like pineapples."],
      peach: ["peach", "I like peaches."],
      melon: ["melon", "I like melons."],
      banana: ["banana", "I like bananas."],
      "kiwi-fruit": ["kiwi fruit", "I like kiwi fruit."],
      lemon: ["lemon", "I like lemons."],
      cherry: ["cherry", "I like cherries."]
    };

    function cardVisual(categoryId, id) {
      const sheets = LETS_TRY_DATA.assets.sheets;
      const cells = LETS_TRY_DATA.assets.knownCells;

      if (categoryId === "sports") {
        return {
          src: LETS_TRY_DATA.assetUrl(sheets.sports.file),
          size: "400% 300%",
          position: cells.sports[id],
          flip: false,
          cropTop: 0
        };
      }

      if (categoryId === "food" && id !== "sausage") {
        return {
          src: LETS_TRY_DATA.assetUrl(sheets.foods.file),
          size: "400% 400%",
          position: cells.foods[id],
          flip: false,
          cropTop: 0
        };
      }

      return {
        src: LETS_TRY_DATA.assetUrl(sheets.fruit.file),
        size: "300% 400%",
        position: cells.fruit[id],
        flip: false,
        cropTop: 0
      };
    }

    const UNIT_CARDS = UNIT_CATEGORY_IDS.flatMap((categoryId) => {
      const category = LETS_TRY_DATA.getCategory(categoryId);

      return category.items.map((entry) => {
        const text = CARD_TEXT[entry.id] || [entry.id.replace(/-/g, " "), entry.id.replace(/-/g, " ")];
        const visual = cardVisual(categoryId, entry.id);

        if (!visual.position) {
          throw new Error(`Missing Unit 5 sprite position for ${categoryId} / ${entry.id}`);
        }

        return {
          id: entry.id,
          category: categoryId,
          word: text[0],
          sentence: text[1],
          alternate: text[0],
          textbook: UNIT_DEFAULT_IDS.has(entry.id),
          visual
        };
      });
    });

    const UNIT_CONFIG = {
      unitNumber: "5",
      unitTitle: "What do you like?",
      browserTitle: "Let’s Try! Tools — What do you like?",

      unitColour: "#00ADA9",
      unitNumberColour: "#52C8C4",

      menuFile: "../lets_try_1.html",

      defaultPrompt: "What do you like?",
      selectionHeading: "Words",
      wordLabel: "Word",
      sentenceLabel: "I like...",
      alternateLabel: "Word",

      pictureAspectRatio: "1 / 1",

      autoSeconds: 3,
      autoSecondsMinimum: 1,
      autoSecondsMaximum: 5,

      cards: UNIT_CARDS
    };

  </script>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const cardsById = new Map(UNIT_CONFIG.cards.map((card) => [card.id, card]));
      const CATEGORY_IDS = Object.fromEntries(
        UNIT_CATEGORY_IDS.map((categoryId) => [
          categoryId,
          LETS_TRY_DATA.getCategory(categoryId).items.map((entry) => entry.id)
        ])
      );

      const elements = {
        flashcard: $("flashcard"),
        unitNumber: $("unitNumber"),
        unitName: $("unitName"),
        gameTitle: $("gameTitle"),
        menuButton: $("menuButton"),
        answerArea: $("answerArea"),
        pictureFrame: $("pictureFrame"),
        cardPicture: $("cardPicture"),
        displayText: $("displayText"),
        gameArea: $("gameArea"),
        floatingTimer: $("floatingTimer"),
        timerDownButton: $("timerDownButton"),
        timerUpButton: $("timerUpButton"),
        timerValue: $("timerValue"),
        autoButton: $("autoButton"),
        previousButton: $("previousButton"),
        nextButton: $("nextButton"),
        counter: $("counter"),
        modeLabel: $("modeLabel"),
        shuffleButton: $("shuffleButton"),
        gameButton: $("gameButton"),
        gameMenu: $("gameMenu"),
        settingsButton: $("settingsButton"),
        keyboardHelp: $("keyboardHelp"),
        scrim: $("scrim"),
        settingsPanel: $("settingsPanel"),
        closeSettingsButton: $("closeSettingsButton"),
        cardOptionGrid: $("cardOptionGrid"),
        categoryOptionGrid: $("cardOptionGrid"),
        selectAllButton: $("selectAllButton"),
        resetButton: $("resetButton"),
        message: $("message"),
        wordLabel: $("wordLabel"),
        sentenceLabel: $("sentenceLabel"),
        alternateLabel: $("alternateLabel"),
        sizeBalanceRange: $("sizeBalanceRange"),
        missingAnswerHints: $("missingAnswerHints"),
        missingAnswerSizeRange: $("missingAnswerSizeRange"),
        missingAnswerSizeValue: $("missingAnswerSizeValue")
      };

      const textbookIds = UNIT_CONFIG.cards
        .filter((card) => card.textbook)
        .map((card) => card.id);

      const initialIds = textbookIds.length
        ? textbookIds
        : UNIT_CONFIG.cards.slice(0, 1).map((card) => card.id);

      const state = {
        selectedIds: new Set(initialIds),
        deck: [],
        position: 0,
        displayMode: "pictureText",
        textDisplay: "word",
        gameMode: "flashcards",
        sizeBalance: 50,
        missingAnswerSize: 10,
        autoSeconds: UNIT_CONFIG.autoSeconds,
        countdown: UNIT_CONFIG.autoSeconds,
        autoTimer: null,
        countdownTimer: null,
        missingOrder: [],
        hiddenMissingIds: new Set(),
        keywordOrder: [],
        keywordSelectedIds: new Set(),
        leftRightTarget: null,
        leftRightLeft: null,
        leftRightRight: null,
        leftRightCorrectSide: null,
        leftRightLocked: false
      };

      function shuffled(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[randomIndex]] = [result[randomIndex], result[index]];
        }
        return result;
      }

      function selectedCards() {
        return UNIT_CONFIG.cards.filter((card) => state.selectedIds.has(card.id));
      }

      function currentCard() {
        return state.deck[state.position] || null;
      }


      function preloadAllCardImages() {
        const sources = [...new Set(UNIT_CONFIG.cards.map((card) => card.visual && card.visual.src).filter(Boolean))];
        return Promise.all(sources.map((src) => new Promise((resolve) => {
          const image = new Image();
          image.onload = () => {
            if (image.decode) image.decode().catch(() => {}).finally(resolve);
            else resolve();
          };
          image.onerror = resolve;
          image.src = src;
        })));
      }

      function initialisePage() {
        document.title = UNIT_CONFIG.browserTitle;
        document.documentElement.style.setProperty("--unit-colour", UNIT_CONFIG.unitColour);
        document.documentElement.style.setProperty("--unit-number-colour", UNIT_CONFIG.unitNumberColour);
        document.documentElement.style.setProperty("--picture-ratio", UNIT_CONFIG.pictureAspectRatio);

        elements.unitNumber.textContent = UNIT_CONFIG.unitNumber;
        elements.unitName.textContent = UNIT_CONFIG.unitTitle;
        elements.wordLabel.textContent = UNIT_CONFIG.wordLabel;
        elements.sentenceLabel.textContent = UNIT_CONFIG.sentenceLabel;
        elements.alternateLabel.textContent = UNIT_CONFIG.alternateLabel;

        state.autoSeconds = Math.max(
          UNIT_CONFIG.autoSecondsMinimum,
          Math.min(UNIT_CONFIG.autoSecondsMaximum, UNIT_CONFIG.autoSeconds)
        );
        state.countdown = state.autoSeconds;

        buildCardOptions();
        rebuildDeck();
      }

      function applyVisual(element, card) {
        const visual = card && card.visual ? card.visual : {};
        element.style.backgroundImage = `url("${visual.src || PLACEHOLDER_IMAGE}")`;
        element.style.backgroundSize = visual.size || "contain";
        element.style.backgroundPosition = visual.position || "center";
        element.style.transform = visual.flip ? "scaleX(-1)" : "scaleX(1)";
        element.style.clipPath = visual.cropTop
          ? `inset(${Number(visual.cropTop)}% 0 0 0)`
          : "none";
      }

      function cardText(card) {
        if (!card) return "SELECT A CARD";
        if (state.textDisplay === "sentence") return card.sentence || card.word;
        if (state.textDisplay === "alternate") return card.alternate || card.word;
        return card.word;
      }

      function leftRightText(card) {
        return cardText(card);
      }

      function toggleCategory(categoryId) {
        const ids = (CATEGORY_IDS[categoryId] || []).filter((id) => cardsById.has(id));
        if (!ids.length) return;

        const allSelected = ids.every((id) => state.selectedIds.has(id));

        if (allSelected) {
          const remaining = [...state.selectedIds].filter((id) => !ids.includes(id));
          if (!remaining.length) {
            elements.message.textContent = "At least one card must stay selected.";
            return;
          }
          ids.forEach((id) => state.selectedIds.delete(id));
        } else {
          ids.forEach((id) => state.selectedIds.add(id));
        }

        elements.message.textContent = "";
        syncCardOptions();
        rebuildDeck();
      }

      function buildCardOptions() {
        const fragment = document.createDocumentFragment();

        UNIT_CATEGORY_IDS.forEach((categoryId) => {
          const category = LETS_TRY_DATA.getCategory(categoryId);
          const cards = UNIT_CONFIG.cards.filter((card) => card.category === categoryId);
          if (!cards.length) return;

          const group = document.createElement("section");
          group.className = "category-word-group";
          group.dataset.categoryGroup = categoryId;

          const categoryButton = document.createElement("button");
          categoryButton.type = "button";
          categoryButton.className = "category-option";
          categoryButton.textContent = category ? category.label : categoryId;
          categoryButton.dataset.category = categoryId;
          categoryButton.setAttribute("aria-pressed", "false");
          categoryButton.addEventListener("click", () => toggleCategory(categoryId));

          const wordGrid = document.createElement("div");
          wordGrid.className = "category-card-grid";

          cards.forEach((card) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "card-option";
            button.textContent = card.word;
            button.title = card.word;
            button.dataset.cardId = card.id;
            button.addEventListener("click", () => toggleCard(card.id));
            wordGrid.append(button);
          });

          group.append(categoryButton, wordGrid);
          fragment.append(group);
        });

        elements.cardOptionGrid.replaceChildren(fragment);
        syncCardOptions();
      }

      function syncCategoryOptions() {
        elements.selectAllButton.addEventListener("click", () => {
        state.selectedIds = new Set(UNIT_CONFIG.cards.map((card) => card.id));
        syncCardOptions();
        rebuildDeck();
      });

      elements.resetButton.addEventListener("click", () => {
        stopAuto();
        state.selectedIds = new Set(initialIds);
        state.displayMode = "pictureText";
        state.textDisplay = "word";
        state.sizeBalance = 50;
        state.autoSeconds = UNIT_CONFIG.autoSeconds;
        state.countdown = state.autoSeconds;
        document.querySelector('input[name="displayMode"][value="pictureText"]').checked = true;
        document.querySelector('input[name="textDisplay"][value="word"]').checked = true;
        elements.sizeBalanceRange.value = "50";
        elements.missingAnswerSizeRange.value = "10";
        state.missingAnswerSize = 10;
        document.documentElement.style.setProperty("--missing-answer-size", "10px");
        elements.missingAnswerSizeValue.textContent = "10 px";
        syncCardOptions();
        rebuildDeck();
      });

      document.querySelectorAll('input[name="displayMode"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          stopAuto();
          state.displayMode = radio.value;
          state.gameMode = "flashcards";
          render();
        });
      });

      document.querySelectorAll('input[name="textDisplay"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          state.textDisplay = radio.value;
          render();
        });
      });

      elements.sizeBalanceRange.addEventListener("input", () => {
        state.sizeBalance = Number(elements.sizeBalanceRange.value);
        render();
      });
      elements.missingAnswerSizeRange.addEventListener("input", () => {
        state.missingAnswerSize = Number(elements.missingAnswerSizeRange.value);
        document.documentElement.style.setProperty("--missing-answer-size", `${state.missingAnswerSize}px`);
        elements.missingAnswerSizeValue.textContent = `${state.missingAnswerSize} px`;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closePanels();
          return;
        }

        if (elements.settingsPanel.classList.contains("open")) return;

        if (state.gameMode === "leftRight") {
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            answerLeftRight("left");
            return;
          }

          if (event.key === "ArrowRight") {
            event.preventDefault();
            answerLeftRight("right");
            return;
          }

          if (event.code === "Space" || event.key === "Enter") {
            event.preventDefault();
            if (state.leftRightLocked) nextLeftRightQuestion();
            return;
          }
        }

        if (state.gameMode === "missing") {
          if (event.key === "ArrowRight" || event.code === "Space" || event.key === "Enter") {
            event.preventDefault();
            hideOneMore();
          } else if (event.key.toLowerCase() === "r") {
            shuffleAction();
          } else if (event.key.toLowerCase() === "g") {
            toggleGameMenu();
          }
          return;
        }

        if (state.gameMode === "keyword") {
          if (event.key === "ArrowRight" || event.code === "Space" || event.key === "Enter") {
            event.preventDefault();
            selectRandomKeyword();
          } else if (event.key.toLowerCase() === "r") {
            shuffleAction();
          } else if (event.key.toLowerCase() === "g") {
            toggleGameMenu();
          }
          return;
        }

        if (event.key === "ArrowRight" || event.code === "Space" || event.key === "Enter") {
          event.preventDefault();
          stopAuto();
          nextCard();
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          stopAuto();
          previousCard();
        } else if (event.key.toLowerCase() === "r") {
          shuffleAction();
        } else if (event.key.toLowerCase() === "a") {
          toggleAuto();
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          changeTimer(1);
        } else if (event.key === "ArrowDown") {
          event.preventDefault();
          changeTimer(-1);
        } else if (event.key.toLowerCase() === "g") {
          toggleGameMenu();
        }
      });

      window.addEventListener("resize", () => {
        requestAnimationFrame(alignSideNavigation);
      });

      preloadAllCardImages().then(initialisePage);
    })();
  </script>
</body>
</html>
