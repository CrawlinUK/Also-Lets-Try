<html lang='en'>
<head>
<meta charset='utf-8'>

<title>What time is it? — Also ESL Games</title>
<style>
:root{--ink:#17202b;--blue:#145b98;--paper:#f3f8fc;--line:#cfe0eb;--sky-day-1:#bfe8ff;--sky-day-2:#ecf8ff;--sky-dawn-1:#ffd39b;--sky-dawn-2:#fff2cb;--sky-dusk-1:#ffbc92;--sky-dusk-2:#8262b2;--sky-night-1:#102443;--sky-night-2:#304f78;--grass-1:#7dc06c;--grass-2:#65a957;--sill-h:clamp(28px,4.8vw,48px);--wood-1:#7a522f;--wood-2:#a06f43;--wood-3:#6b4828;--digit-red:#ff255d;--digit-red-soft:#ff86a8;--danger:#e24959}

.stars{position:absolute;inset:0;display:none}.window-view.night .stars{display:block}.star{position:absolute;width:4px;height:4px;background:#fff9d1;border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,.6)}

.window-cross-v,.window-cross-h{position:absolute;background:#f1eadc;box-shadow:0 0 0 1px rgba(179,151,119,.18);z-index:2}.window-cross-v{top:0;bottom:0;left:50%;width:clamp(8px,1vw,12px);transform:translateX(-50%)}.window-cross-h{left:0;right:0;top:50%;height:clamp(8px,1vw,12px);transform:translateY(-50%)}
.scene-label{position:absolute;top:12px;left:12px;z-index:3;padding:6px 12px;border-radius:999px;font-weight:900;font-size:clamp(.82rem,1.35vw,1rem);background:rgba(255,255,255,.92);color:#214a6d;box-shadow:0 4px 12px rgba(0,0,0,.08)}

.clock-holder,.digital-holder{position:absolute;left:50%;transform:translateX(-50%);z-index:4;display:flex;justify-content:center}.clock-holder{bottom:calc(var(--sill-h) + 22px)}.digital-holder{bottom:calc(var(--sill-h) + 6px)}

5,45,100,.15)}.clock-radio-side{display:grid;grid-template-rows:1fr auto;gap:8px;min-width:0}.clock-radio-badges{display:grid;align-content:start;gap:6px;padding-top:4px}.clock-radio-badge{display:inline-block;width:max-content;max-width:100%;padding:3px 0;background:transparent;color:#e2e8f5;font-weight:700;font-size:clamp(.72rem,1.2vw,.95rem);letter-spacing:.04em;text-transform:uppercase}.clock-radio-knob-wrap{display:flex;align-items:end;justify-content:flex-end;padding-right:6px}.clock-radio-knob{width:48px;height:36px;border-radius:999px;background:radial-gradient(circle at 35% 35%,#15202e 0 20%,#09111d 21% 60%,#050a12 61% 100%);box-shadow:inset -8px -4px 10px rgba(255,255,255,.03),inset 10px 8px 12px rgba(0,0,0,.35)}.clock-radio-base{height:10px;background:linear-gradient(180deg,#0d1015,#020305)}.adjust-rail{position:fixed;z-index:20;top:50%;transform:translateY(-50%);display:grid;gap:9px}.adjust-rail.left{left:clamp(5px,1.3vw,22px)}.adjust-rail.right{right:clamp(5px,1.3vw,22px)}.adjust-rail button{min-width:clamp(58px,6.2vw,90px);min-height:clamp(48px,6vw,72px);border-radius:15px;background:#fff;box-shadow:0 4px 12px #1b3e6030;font-size:clamp(.9rem,1.5vw,1.25rem)}
.settings-wrap{position:relative}.settings-menu{position:absolute;bottom:calc(100% + 9px);left:0;z-index:35;width:min(320px,90vw);background:white;border:2px solid #c3d9e9;border-radius:15px;padding:12px;box-shadow:0 12px 30px #193f6040;display:grid;gap:9px}.settings-menu[hidden]{display:none}.settings-menu button{width:100%;text-align:left}.settings-menu strong{color:#204867}.settings-menu button[aria-pressed='true']{background:#dcefff;border-color:#4683b8}.compact-steps{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding-bottom:8px;border-bottom:1px solid #cadce8}.compact-steps button{font-size:1rem}@media(max-width:1100px){.adjust-rail{display:none}.compact-steps{display:grid}}
.window-stage:not(.show-digital) .digital-holder{display:none}.window-stage:not(.show-clock) .clock-holder{display:none}.window-stage.show-clock.show-digital .clock-holder{left:31%}.window-stage.show-clock.show-digital .digital-holder{left:74%;bottom:calc(var(--sill-h) + 10px)}.window-stage.show-clock.show-digital .clock{width:min(43dvh,43vw,360px)}.window-stage.show-clock.show-digital .clock-radio{width:min(380px,40vw)}.window-stage.show-clock.show-digital .clock-radio-top{height:38px}.window-stage.show-clock.show-digital .digital-window{min-height:58px;padding:4px 8px}.window-stage.show-clock.show-digital .digital-readout{min-width:0;gap:8px}.window-stage.show-clock.show-digital .digital-numbers{font-size:clamp(1.55rem,3vw,2.4rem)}.window-stage.show-clock.show-digital .window-stage.show-clock.show-digital .window-stage.show-clock.show-digital .clock-radio-face{grid-template-columns:minmax(0,1fr) 98px;gap:6px}.window-stage.show-clock.show-digital .clock-radio-badges{gap:4px;padding-top:0}.window-stage.show-clock.show-digital .clock-radio-badge{font-size:.58rem;padding:2px 0}.window-stage.show-clock.show-digital .clock-radio-knob{width:38px;height:24px}.window-stage.show-clock.show-digital .digital-indicator{font-size:.63rem}
.answer{width:min(940px,96vw);min-height:clamp(68px,10dvh,106px);display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:5px solid #c7dff2;border-radius:20px;padding:10px 16px;position:relative}.sentence{font-size:clamp(1.35rem,3.5vw,3.3rem);font-weight:900;line-height:1.14;color:#184f8b;text-wrap:balance}.answer.hidden-answer .sentence{visibility:hidden}.answer.hidden-answer::after{content:'What time is it?';position:absolute;font-size:clamp(1.3rem,3vw,2.4rem);font-weight:900;color:#59738b}
footer{background:#fff;border-top:2px solid var(--line);padding:8px 10px max(8px,env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:center;gap:7px}button{min-height:40px;padding:10px 12px;border:1px solid #b8d6ea;border-radius:11px;background:#eaf6ff;color:#18496b;font-size:clamp(.78rem,1.2vw,1rem);font-weight:800;cursor:pointer}button.random{background:#ffedcf;border-color:#eeb974;color:#885010}button:focus-visible,.back:focus-visible{outline:3px solid #ef8c24;outline-offset:2px}
@media (max-width:820px){.window-frame{aspect-ratio:15/11}.clock{width:min(46dvh,68vw,380px)}.clock-radio{width:min(92vw,520px)}}
@media (max-width:680px){header{padding:6px 12px}.window-stage{padding-inline:6px}.window-frame{aspect-ratio:5/4}.clock{width:min(40dvh,76vw,320px)}button{padding:8px 9px;min-height:38px}.clock-radio{width:min(95vw,500px)}.window-stage.show-clock.show-digital .clock-holder{left:50%;bottom:calc(var(--sill-h) + 120px)}.window-stage.show-clock.show-digital .digital-holder{left:50%;bottom:calc(var(--sill-h) + 8px)}.window-stage.show-clock.show-digital .clock-radio{width:min(86vw,420px)}}
@media (max-height:720px) and (orientation:landscape){header{padding-block:4px} h1{font-size:1.4rem} main{grid-template-rows:minmax(0,1fr) auto}.answer{display:none}.window-stage{width:min(1020px,100%)}.window-frame{aspect-ratio:16/8.5}.clock{width:min(54dvh,38vw,320px)}.clock-radio{width:min(420px,43vw)}footer{padding:5px 8px}button{min-height:34px;padding:5px 8px}}
</style>

<body>
<header><h1>What time is it?</h1><a class='back' href='index.html'>← ESL Games</a></header>
<div class='adjust-rail left' aria-label='Backwards time controls'><button type='button' id='minusHourBtn'>−1h</button><button type='button' id='minusMinuteBtn'>−15m</button></div>
<div class='adjust-rail right' aria-label='Forwards time controls'><button type='button' id='plusHourBtn'>+1h</button><button type='button' id='plusMinuteBtn'>+15m</button></div>
<main><section class='scene-shell'><div class='window-stage show-clock' id='windowStage'><div class='window-frame'><div class='window-view day' id='windowView' aria-hidden='true'><div class='scene-label' id='sceneLabel'>Morning</div><div class='sun' id='sun'></div><div class='moon' id='moon'></div><div class='stars'><span class='star' style='left:12%;top:16%'></span><span class='star' style='left:24%;top:10%'></span><span class='star' style='left:37%;top:22%'></span><span class='star' style='left:58%;top:12%'></span><span class='star' style='left:72%;top:18%'></span><span class='star' style='left:84%;top:10%'></span><span class='star' style='left:66%;top:31%'></span><span class='star' style='left:18%;top:30%'></span></div><div class='cloud one'></div><div class='cloud two'></div><div class='horizon'></div></div><div class='window-cross-v' aria-hidden='true'></div><div class='window-cross-h' aria-hidden='true'></div></div><div class='window-sill' aria-hidden='true'></div>
<div class='clock-holder'><div class='clock' id='clock' role='img' aria-label='Clock showing 01:00 a.m.'><div class='hand hour-hand' id='hourHand'></div><div class='hand minute-hand' id='minuteHand'></div><div class='centre-dot'></div></div></div>
<div class='digital-holder'><div class='clock-radio' aria-label='Digital time display'><div class='clock-radio-top'><div class='clock-radio-speaker' aria-hidden='true'></div><div class='clock-radio-screen' aria-hidden='true'></div></div><div class='clock-radio-face'><div class='digital-window'><div class='digital-indicators'><div class='digital-indicator' id='amLamp'>AM</div><div class='digital-indicator' id='pmLamp'>PM</div></div><div class='digital-readout'><div class='digital-numbers' id='digitalNumbers'>01:00</div></div></div><div class='clock-radio-side'><div class='clock-radio-badges'><span class='clock-radio-badge'>Electronic</span><span class='clock-radio-badge'>Clock</span><span class='clock-radio-badge'>Radio</span></div><div class='clock-radio-knob-wrap'><div class='clock-radio-knob' aria-hidden='true'></div></div></div></div><div class='clock-radio-base' aria-hidden='true'></div></div></div>
</div></section><section class='answer' id='answer'><div class='sentence' id='sentence'>It’s one a.m.</div></section></main>
<footer aria-label='Teacher controls'><button type='button' class='random' data-random='60' aria-label='Random hour'>🎲 1h</button><button type='button' class='random' data-random='15' aria-label='Random 15 minutes'>🎲 15m</button><button type='button' class='random' data-random='5' aria-label='Random 5 minutes'>🎲 5m</button><button type='button' id='textBtn'>Hide words</button><div class='settings-wrap'><button type='button' id='menuBtn'>⋮</button><div class='settings-menu' id='settingsMenu' hidden><div class='compact-steps'><button type='button' data-change='-60'>−1h</button><button type='button' data-change='60'>+1h</button><button type='button' data-change='-15'>−15m</button><button type='button' data-change='15'>+15m</button></div><strong>Display settings</strong><button type='button' id='clockToggle' aria-pressed='true'>Display: clock</button><button type='button' id='digitalToggle' aria-pressed='false'>Display: digital</button><button type='button' id='oclockToggle' aria-pressed='false'>Use o’clock: Off</button><button type='button' id='periodBtn'>Switch a.m./p.m.</button><button type='button' id='resetBtn'>↺ Reset</button></div></div></footer>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),clock=$('clock'),hourHand=$('hourHand'),minuteHand=$('minuteHand'),digitalNumbers=$('digitalNumbers'),amLamp=$('amLamp'),pmLamp=$('pmLamp'),sentence=$('sentence'),answer=$('answer'),textBtn=$('textBtn'),menuBtn=$('menuBtn'),settingsMenu=$('settingsMenu'),clockToggle=$('clockToggle'),digitalToggle=$('digitalToggle'),oclockToggle=$('oclockToggle'),windowView=$('windowView'),sceneLabel=$('sceneLabel'),windowStage=$('windowStage'),sun=$('sun'),moon=$('moon');
const hourWords=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'],unitWords=['','one','two','three','four','five','six','seven','eight','nine'],teenWords=['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],tensWords=['','','twenty','thirty','forty','fifty'];
let totalMinutes=60,showWords=true,showClock=true,showDigital=false,useOclock=false;
for(let i=1;i<=12;i++){const el=document.createElement('div');el.className='number';el.textContent=i;const angle=(i*30-90)*Math.PI/180,radius=39;el.style.left=(50+radius*Math.cos(angle))+'%';el.style.top=(50+radius*Math.sin(angle))+'%';clock.appendChild(el)}
const pad=n=>String(n).padStart(2,'0'),normalise=n=>(n%1440+1440)%1440;
function minuteWords(n){if(n<10)return unitWords[n];if(n<20)return teenWords[n-10];return tensWords[Math.floor(n/10)]+(n%10?'-'+unitWords[n%10]:'')}
function spokenTime(hour24,minute){const hourWord=hourWords[hour24%12],periodText=hour24<12?'a.m.':'p.m.';if(minute===0)return useOclock?`It’s ${hourWord} o’clock.`:`It’s ${hourWord} ${periodText}.`;if(minute<10)return `It’s ${hourWord} oh ${minuteWords(minute)} ${periodText}.`;return `It’s ${hourWord} ${minuteWords(minute)} ${periodText}.`}
function sceneType(hour24){if(hour24>=5&&hour24<7)return'dawn';if(hour24>=7&&hour24<17)return'day';if(hour24>=17&&hour24<19)return'dusk';return'night'}
function sceneName(type,hour24){if(type==='day')return hour24<12?'Morning':'Afternoon';return({dawn:'Dawn',dusk:'Dusk',night:'Night'})[type]}
function setSkyBody(el,progress,reverse=false){const x=8+(84*(reverse?(1-progress):progress)),y=72-(44*Math.sin(progress*Math.PI));el.style.left=x+'%';el.style.top=y+'%'}
function updateCelestial(hour24,minute){const decimalHour=hour24+minute/60,type=sceneType(hour24);if(type==='night'){const prog=decimalHour>=19?(decimalHour-19)/10:(decimalHour+5)/10;setSkyBody(moon,Math.min(Math.max(prog,0),1),true);moon.style.opacity='1';sun.style.opacity='0'}else{const prog=(decimalHour-5)/14;setSkyBody(sun,Math.min(Math.max(prog,0),1));sun.style.opacity='1';moon.style.opacity='0'}}
function applyDisplayClasses(){windowStage.classList.toggle('show-clock',showClock);windowStage.classList.toggle('show-digital',showDigital);clockToggle.setAttribute('aria-pressed',String(showClock));digitalToggle.setAttribute('aria-pressed',String(showDigital));oclockToggle.setAttribute('aria-pressed',String(useOclock));clockToggle.textContent=`Display: clock ${showClock?'On':'Off'}`;digitalToggle.textContent=`Display: digital ${showDigital?'On':'Off'}`;oclockToggle.textContent=`Use o’clock: ${useOclock?'On':'Off'}`}
function updateClock(){const hour24=Math.floor(totalMinutes/60),minute=totalMinutes%60,period=hour24<12?'AM':'PM',hour12=hour24%12;hourHand.style.transform=`translateX(-50%) rotate(${hour12*30+minute*.5}deg)`;minuteHand.style.transform=`translateX(-50%) rotate(${minute*6}deg)`;digitalNumbers.textContent=`${pad(hour12 || 12)}:${pad(minute)}`;amLamp.classList.toggle('active',period==='AM');pmLamp.classList.toggle('active',period==='PM');sentence.textContent=spokenTime(hour24,minute);answer.classList.toggle('hidden-answer',!showWords);textBtn.textContent=showWords?'Hide words':'Show words';const type=sceneType(hour24);windowView.classList.remove('dawn','day','dusk','night');windowView.classList.add(type);sceneLabel.textContent=sceneName(type,hour24);updateCelestial(hour24,minute);clock.setAttribute('aria-label',`Clock showing ${pad(hour24)}:${pad(minute)} ${period.toLowerCase()}`);applyDisplayClasses()}
function changeTime(amount){totalMinutes=normalise(totalMinutes+amount);updateClock()} function randomTime(step){totalMinutes=Math.floor(Math.random()*(1440/step))*step;updateClock()}
[['minusHourBtn',-60],['plusHourBtn',60],['minusMinuteBtn',-15],['plusMinuteBtn',15]].forEach(([id,val])=>$(id).addEventListener('click',()=>changeTime(val)));document.querySelectorAll('[data-change]').forEach(button=>button.addEventListener('click',()=>changeTime(Number(button.dataset.change))));document.querySelectorAll('[data-random]').forEach(button=>button.addEventListener('click',()=>randomTime(Number(button.dataset.random))));
textBtn.addEventListener('click',()=>{showWords=!showWords;updateClock()});menuBtn.addEventListener('click',()=>{settingsMenu.hidden=!settingsMenu.hidden;menuBtn.setAttribute('aria-expanded',String(!settingsMenu.hidden))});document.addEventListener('click',event=>{if(!settingsMenu.hidden&&!event.target.closest('.settings-wrap')){settingsMenu.hidden=true;menuBtn.setAttribute('aria-expanded','false')}});clockToggle.addEventListener('click',()=>{showClock=!showClock;if(!showClock&&!showDigital)showDigital=true;updateClock()});digitalToggle.addEventListener('click',()=>{showDigital=!showDigital;if(!showClock&&!showDigital)showClock=true;updateClock()});oclockToggle.addEventListener('click',()=>{useOclock=!useOclock;updateClock()});$('periodBtn').addEventListener('click',()=>changeTime(720));$('resetBtn').addEventListener('click',()=>{totalMinutes=60;showWords=true;showClock=true;showDigital=false;useOclock=false;settingsMenu.hidden=true;updateClock()});
document.addEventListener('keydown',event=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.altKey||event.ctrlKey||event.metaKey)return;const actions={ArrowLeft:()=>changeTime(-15),ArrowRight:()=>changeTime(15),ArrowDown:()=>changeTime(-60),ArrowUp:()=>changeTime(60),' ':()=>randomTime(15),Enter:()=>randomTime(60),t:()=>{showWords=!showWords;updateClock()},d:()=>{showDigital=!showDigital;if(!showClock&&!showDigital)showClock=true;updateClock()},c:()=>{showClock=!showClock;if(!showClock&&!showDigital)showDigital=true;updateClock()},o:()=>{useOclock=!useOclock;updateClock()}};const action=actions[event.key];if(action){event.preventDefault();action()}});
updateClock();
})();
</script>
