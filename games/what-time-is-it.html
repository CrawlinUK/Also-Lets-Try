<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>What time is it? — Also ESL</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:Arial,sans-serif;background:#f3f9fc;color:#172332;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px}h1{font-size:clamp(1.5rem,3.5vw,3rem);margin:0;color:#175790}a{color:#175790;font-weight:bold}
main{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;place-items:center;gap:8px;padding:0 12px 9px}
.clock{width:min(68dvh,76vw,720px);aspect-ratio:1;position:relative;overflow:hidden;border-radius:50%;background:white;border:clamp(6px,1vw,11px) solid #1e3042;box-shadow:0 12px 28px #15365933}
.clock.twentyfour{background:conic-gradient(#24365d 0 25%,#fff0a7 25% 75%,#24365d 75% 100%)}
.clock.twentyfour:before{content:"";position:absolute;inset:22%;border:3px solid #6d84a5;border-radius:50%;background:white;z-index:1}
.num{position:absolute;transform:translate(-50%,-50%);font-size:clamp(1.15rem,4.2vmin,3.2rem);font-weight:900;z-index:3;pointer-events:none}
.num.small{font-size:clamp(.7rem,2.65vmin,1.5rem);color:#1d3448;text-shadow:0 1px 2px white}.num.dark{color:white;text-shadow:0 1px 3px #14213a}
.clock:not(.twentyfour) .small,.clock.twentyfour .normal{display:none}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;z-index:5;border-radius:99px}.hour{height:25%;width:clamp(8px,1.55vw,17px);background:#111827}.minute{height:36%;width:clamp(5px,.9vw,10px);background:#e84858}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:clamp(19px,3.2vw,34px);aspect-ratio:1;background:#172332;border:4px solid white;border-radius:50%;z-index:7}
.visual{position:absolute;z-index:3;display:none;pointer-events:none}.clock.twentyfour .visual{display:block}
.moon{top:14%;left:48%;font-size:clamp(1rem,3.5vmin,2.4rem)}.sun{bottom:14%;left:48%;font-size:clamp(1rem,3.5vmin,2.4rem)}
.period{font-weight:900;font-size:clamp(.85rem,2.2vmin,1.5rem);border-radius:99px;padding:3px 9px;border:2px solid #354f79;background:white;top:39%}.am{left:60%}.pm{right:60%}
.answer{width:min(900px,96vw);min-height:clamp(67px,11dvh,110px);background:white;border:5px solid #c3def5;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:7px 16px;text-align:center}
#sentence{font-size:clamp(1.35rem,3.5vw,3.35rem);font-weight:900;color:#18518c;line-height:1.15}
#periodChip{font-size:clamp(1.05rem,2.5vw,2rem);font-weight:900;border:3px solid #e5ab45;color:#764917;background:#fff3bc;border-radius:99px;padding:3px 12px}
#periodChip.pm{border-color:#6274c0;background:#e2e8ff;color:#243a84}
.answer.hidden-answer{position:relative}.answer.hidden-answer #sentence,.answer.hidden-answer #periodChip{visibility:hidden}.answer.hidden-answer:after{content:"What time is it?";position:absolute;font-size:clamp(1.3rem,3vw,2.5rem);font-weight:900;color:#5b748c}
footer{background:white;border-top:2px solid #d2e2ee;padding:8px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
button{min-height:40px;padding:8px 12px;border:1px solid #b6d3e5;border-radius:11px;background:#eaf5fc;color:#194e73;font-size:clamp(.78rem,1.25vw,1rem);font-weight:800;cursor:pointer;touch-action:manipulation}
button.random{background:#ffefd2;border-color:#eebc70;color:#86510b}button.active{background:#304e89;color:white}button:focus-visible,a:focus-visible{outline:3px solid #e99934;outline-offset:2px}
@media(max-width:720px){.clock{width:min(61dvh,92vw)}button{padding:7px 9px}footer{gap:5px}}
@media(max-height:620px) and (orientation:landscape){main{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.clock{width:min(70dvh,48vw)}.answer{width:100%}footer{padding:5px}button{min-height:33px;padding:4px 8px}h1{font-size:1.5rem}}
</style></head>
<body><header><h1>What time is it?</h1><a href="index.html">← ESL Games</a></header>
<main><div class="clock" id="clock" role="img" aria-label="Analogue clock"><div class="visual moon">🌙</div><div class="visual sun">☀️</div>
<div class="visual period am">a.m.</div><div class="visual period pm">p.m.</div>
<div class="hand hour" id="hourHand"></div><div class="hand minute" id="minuteHand"></div><div class="hub"></div></div>
<div class="answer" id="answer"><span id="sentence"></span><span id="periodChip"></span></div></main>
<footer><button data-step="-60">−1h</button><button data-step="60">+1h</button><button data-step="-15">−15m</button><button data-step="15">+15m</button>
<button class="random" data-random="60">Random hour</button><button class="random" data-random="15">Random 15m</button><button class="random" data-random="5">Random 5m</button>
<button id="answerBtn">Hide answer</button><button id="modeBtn">24-hour dial</button><button id="switchBtn">Switch a.m./p.m.</button><button id="resetBtn">Reset</button></footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),clock=$('clock'),answer=$('answer'),sentence=$('sentence'),chip=$('periodChip'),modeBtn=$('modeBtn'),answerBtn=$('answerBtn');
const words=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven'],digits=['','one','two','three','four','five','six','seven','eight','nine'];
let minutes=60,mode24=false,revealed=true;
const norm=n=>(n%1440+1440)%1440,pad=n=>String(n).padStart(2,'0');
const word=n=>n<10?digits[n]:n<20?['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'][n-10]:['','','twenty','thirty','forty','fifty'][Math.floor(n/10)]+(n%10?' '+digits[n%10]:'');
function number(value,deg,radius,css){const el=document.createElement('span');el.className='num '+css;el.textContent=value;const rad=(deg-90)*Math.PI/180;el.style.left=(50+Math.cos(rad)*radius*100)+'%';el.style.top=(50+Math.sin(rad)*radius*100)+'%';clock.appendChild(el)}
for(let i=1;i<=12;i++)number(i,i*30,.39,'normal');
for(let i=0;i<24;i++)number(pad(i),i*15,.426,'small'+(i<6||i>=18?' dark':''));
function speak(h,m){const now=words[h%12],next=words[(h+1)%12];if(!m)return 'It’s '+now+' o’clock';if(m===15)return 'It’s quarter past '+now;if(m===30)return 'It’s half past '+now;if(m===45)return 'It’s quarter to '+next;if(m<30)return 'It’s '+word(m)+' past '+now;return 'It’s '+word(60-m)+' to '+next}
function update(){const h=Math.floor(minutes/60),m=minutes%60,period=(m>30?(h+1)%24:h)<12?'a.m.':'p.m.';
$('hourHand').style.transform='translateX(-50%) rotate('+(mode24?h*15+m*.25:(h%12)*30+m*.5)+'deg)';
$('minuteHand').style.transform='translateX(-50%) rotate('+(m*6)+'deg)';
sentence.textContent=speak(h,m);chip.textContent=period;chip.classList.toggle('pm',period==='p.m.');
clock.classList.toggle('twentyfour',mode24);clock.setAttribute('aria-label','Clock showing '+pad(h)+':'+pad(m));
answer.classList.toggle('hidden-answer',!revealed);answerBtn.textContent=revealed?'Hide answer':'Reveal answer';
modeBtn.textContent=mode24?'12-hour dial':'24-hour dial';modeBtn.classList.toggle('active',mode24);
}
function change(n){minutes=norm(minutes+n);update()}function random(step){minutes=Math.floor(Math.random()*(1440/step))*step;update()}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>change(+b.dataset.step)));
document.querySelectorAll('[data-random]').forEach(b=>b.addEventListener('click',()=>random(+b.dataset.random)));
answerBtn.addEventListener('click',()=>{revealed=!revealed;update()});modeBtn.addEventListener('click',()=>{mode24=!mode24;update()});
$('switchBtn').addEventListener('click',()=>change(720));$('resetBtn').addEventListener('click',()=>{minutes=60;mode24=false;revealed=true;update()});
document.addEventListener('keydown',e=>{if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;
const actions={ArrowRight:()=>change(15),ArrowLeft:()=>change(-15),ArrowUp:()=>change(60),ArrowDown:()=>change(-60),' ':()=>random(15),Enter:()=>random(60),t:()=>{revealed=!revealed;update()},c:()=>{mode24=!mode24;update()}};
if(actions[e.key]){e.preventDefault();actions[e.key]()}});update();
})();
</script></body></html>
